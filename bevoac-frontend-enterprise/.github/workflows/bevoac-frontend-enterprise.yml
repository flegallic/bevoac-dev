name: bevoac-frontend-demo-build-reference

# Reference only: GitHub loads workflows only from the repository root
# .github/workflows directory. The canonical V6.2.0 gate builds this demo
# frontend and never deploys it automatically.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo-build-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Build DEMO-ONLY frontend
        working-directory: bevoac-frontend-enterprise
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm run build
