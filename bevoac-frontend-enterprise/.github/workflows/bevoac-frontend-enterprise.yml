name: bevoac-frontend-enterprise

on:
  push:
    branches: [main]
    paths:
      - "bevoac-frontend-enterprise/**"
      - ".github/workflows/bevoac-frontend-enterprise.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  FRONTEND_IMAGE_NAME: bevoac-frontend-enterprise
  FRONTEND_VERSION: v1.0.0

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - name: Build and push frontend image
        working-directory: bevoac-frontend-enterprise
        run: |
          IMAGE="${{ vars.ACR_LOGIN_SERVER }}/${FRONTEND_IMAGE_NAME}:${FRONTEND_VERSION}"
          docker build --platform linux/amd64 -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Show image reference
        run: echo "${{ vars.ACR_LOGIN_SERVER }}/${FRONTEND_IMAGE_NAME}:${FRONTEND_VERSION}"
