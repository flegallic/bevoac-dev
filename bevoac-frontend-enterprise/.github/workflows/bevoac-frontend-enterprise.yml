name: bevoac-frontend-demo-build-reference

# Reference only: GitHub loads workflows only from the repository root
# .github/workflows directory. The canonical V6.2.0 gate builds this demo
# frontend and never deploys it automatically.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo-build-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
      - name: Build DEMO-ONLY frontend
        working-directory: bevoac-frontend-enterprise
        run: |
          npm ci --no-audit --no-fund
          npm run typegen
          npm run typecheck
          npm run build
